# Own org packages bypass pnpm 11's default minimumReleaseAge (1440 min) so
# internal releases install immediately instead of after the 24h cooldown.
minimumReleaseAgeExclude:
  - "@sebastian-gmbh/*"
  - "@sebastian-software/*"
  # Pi SDK 1.0.0 was adopted on 2026-10-01, inside its 24h cooldown, at the
  # owner's request. These exact versions are safe to remove from 2026-10-02.
  - "@earendil-works/chord@1.0.0"
  - "@earendil-works/pi-agent-core@1.0.0"
  - "@earendil-works/pi-ai@1.0.0"
  - "@earendil-works/pi-codemode@1.0.0"
  - "@earendil-works/pi-coding-agent@1.0.0"
  - "@earendil-works/pi-mcp@1.0.0"
  - "@earendil-works/pi-telemetry@1.0.0"
  - "@earendil-works/pi-tui@1.0.0"
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false
  unrs-resolver: true
