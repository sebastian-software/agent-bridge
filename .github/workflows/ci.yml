name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json
      - name: Run repository checks
        run: pnpm check
      # minimum-release-age=0 mirrors the apply invocation in
      # renovate-config/standards.json: pnpm 11 defaults minimumReleaseAge to
      # 1440 (24h), so without the bypass `check` resolves the newest standards
      # older than a day while the stamp was written by apply against the true
      # latest - a freshly released version then reads as false drift.
      - name: Check org standards
        run: pnpm --config.minimum-release-age=0 dlx @sebastian-software/standards check
      - name: Audit production dependencies
        run: pnpm audit --prod
        continue-on-error: true
